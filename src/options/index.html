<!DOCTYPE html>
<html lang="zh-CN" data-curated-ui>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Curated - 设置</title>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1 class="title">插件设置</h1>
        <p class="subtitle">配置 Curated 服务端连接</p>
      </header>

      <form class="card" id="settings-form">
        <div class="card-head">
          <div class="card-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3" />
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </svg>
          </div>
          <h2 class="card-title">连接与同步</h2>
        </div>

        <div class="nested">
          <div class="field-row">
            <div class="field-copy">
              <span class="label" id="developer-mode-label">开发者模式</span>
              <p class="hint" id="developer-mode-hint">开启后可自定义默认服务端地址；关闭后连接本机 8081。保存后生效。</p>
            </div>
            <label class="toggle">
              <input type="checkbox" id="developer-mode" aria-labelledby="developer-mode-label" aria-describedby="developer-mode-hint" />
              <span class="slider" aria-hidden="true"></span>
            </label>
          </div>
        </div>

        <div class="nested">
          <div class="field-copy">
            <label class="label" for="server-url">默认服务端地址</label>
            <p class="hint">开启开发者模式后可修改，例如 http://127.0.0.1:8080。</p>
            <input
              type="text"
              id="server-url"
              class="input"
              placeholder="127.0.0.1:8081"
              autocomplete="off"
              spellcheck="false"
              required
            />
          </div>
        </div>

        <div class="nested nested-danger">
          <div class="field-row">
            <div class="field-copy">
              <span class="label" id="auto-remove-label">自动移除已入库</span>
              <p class="hint">
                在 JavDB 想看列表扫描后，自动删除已入库影片（绕过确认弹窗，需已登录 JavDB）
              </p>
            </div>
            <label class="toggle">
              <input
                type="checkbox"
                id="auto-remove"
                aria-labelledby="auto-remove-label"
              />
              <span class="slider" aria-hidden="true"></span>
            </label>
          </div>
        </div>

        <div class="actions">
          <button type="button" class="btn btn-secondary" id="test-btn">
            测试连接
          </button>
          <button type="submit" class="btn btn-primary" id="save-btn">
            保存设置
          </button>
        </div>
      </form>

      <p class="status" id="status" role="status" aria-live="polite"></p>
    </div>
  </body>
</html>
